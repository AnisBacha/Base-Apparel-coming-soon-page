<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/style.css">
  
  <title>Frontend Mentor | Base Apparel coming soon page</title>

</head>
<body>

  <main class="main">
    <img class="main__heroD" src="./images/hero-desktop.jpg" alt="logo">
    <div class="main__content">
      <img class="main__logo" src="./images/logo.svg" alt="logo">
      <img class="main__heroM" src="./images/hero-mobile.jpg" alt="logo">
  
      <h1 class="main__h1"><span>WE'RE</span> <br> COMING <br> SOON</h1>
    
      <p class="main__p">Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals.  </p>
    
      <div class="input-container">
        <input id="input" class="main__input" placeholder="Email Address"></input>
        <img id="submit" class="main__arrow" src="./images/icon-arrow.svg" alt="icon-arrow">
  
        <p id="error-msg" class="main__error-msg">Please provide a valid email</p>
        <img id="error-icon" class="main__error-icon" src="./images/icon-error.svg" alt="icon-error">
      </div>
    </div>
  </main>
  <script src="./src/main.js"></script>
  
</body>
</html>
